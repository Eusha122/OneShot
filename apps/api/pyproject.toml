[project]
name = "visual-learning-api"
version = "0.1.0"
description = "FastAPI backend for the AI Visual Learning Platform."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "pydantic-settings>=2.7.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.23",
  "aiosqlite>=0.19.0",
  "alembic>=1.13.1",
  "rich>=13.0.0",
  "beautifulsoup4>=4.12.0",
  "arq>=0.26.1",
  "redis>=5.0.0",
  "google-generativeai>=0.8.0",
  "Pillow>=10.0.0",
  "python-multipart>=0.0.18",
  "aiofiles>=24.1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "ruff>=0.8.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
